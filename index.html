<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>생활비 가계부</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f8f82">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#f3f6ee; --surface:#ffffff; --surface-2:#edf1e6;
    --ink:#181c14; --muted:#5c6353; --muted-2:#8b9280;
    --line:#d6dbc7; --line-soft:#e7ebde;
    --accent:#0f8f82; --accent-ink:#0b6b61; --accent-soft:rgba(15,143,130,.14);
    --pos:#2fa66b; --warn:#e2833a; --over:#e2574a;
    --fixed:#6a63c4; --fixed-soft:#a29bdb;
    --shadow:rgba(28,40,35,.10);
    --ease-out:cubic-bezier(.16,1,.3,1);
    --cc1:#0f8f82; --cc2:#e2707a; --cc3:#e0a63a; --cc4:#6a63c4; --cc5:#2fa66b; --cc6:#3a8fc9; --cc7:#c75fa8; --cc8:#8b95a8;
    --cc9:#d2753a; --cc10:#7a9a2e; --cc11:#9b6b4f; --cc12:#b04a5e; --cc13:#a07ad0; --cc14:#c4a15a; --cc15:#3c7a5a; --cc16:#d98f9e;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12180f; --surface:#1a221b; --surface-2:#202a20;
      --ink:#eef3e7; --muted:#a3ab97; --muted-2:#727a67;
      --line:#2f3a2c; --line-soft:#232d21;
      --accent:#3fd9c7; --accent-ink:#8ff0e4; --accent-soft:rgba(63,217,199,.18);
      --pos:#5fd591; --warn:#f0a24f; --over:#f07a6d;
      --fixed:#a29bff; --fixed-soft:#7d76c9;
      --shadow:rgba(0,0,0,.38);
      --cc1:#3fd9c7; --cc2:#f2909a; --cc3:#f0c15a; --cc4:#a29bff; --cc5:#5fd591; --cc6:#6fb4ec; --cc7:#e68ac8; --cc8:#a7b0c2;
      --cc9:#f0a06a; --cc10:#a9c85a; --cc11:#c9987a; --cc12:#e07f93; --cc13:#c4a3ee; --cc14:#e3c98a; --cc15:#6fbf95; --cc16:#f0b6c2;
    }
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink); min-height:100dvh;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .num{ font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1; letter-spacing:-.01em; }
  button{ font:inherit; }
  input{ font:inherit; }

  .app{ max-width:420px; margin:0 auto; padding:18px 16px 100px; display:flex; flex-direction:column; gap:16px; min-height:100dvh; position:relative; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; }
  .brand{ font-weight:700; font-size:17px; letter-spacing:-.01em; }
  .icon-btn{
    width:34px; height:34px; border-radius:50%; border:1px solid var(--line); background:var(--surface);
    color:var(--muted); display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:border-color 150ms var(--ease-out), color 150ms var(--ease-out);
  }
  .icon-btn:hover{ border-color:var(--accent); color:var(--accent-ink); }

  .sync-indicator{
    display:none; align-items:center; justify-content:center; gap:6px;
    font-size:11px; color:var(--muted-2); padding:1px 0 3px;
    opacity:0; transition:opacity 200ms var(--ease-out);
  }
  .sync-indicator.show{ display:flex; opacity:1; }
  .sync-indicator .dot{ width:6px; height:6px; border-radius:50%; background:var(--accent); animation:sync-pulse 1s ease-in-out infinite; }
  @keyframes sync-pulse{ 0%,100%{ opacity:.3; } 50%{ opacity:1; } }

  .ledger-label-row{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .ledger-label-row .total{ font-weight:700; color:var(--ink); white-space:nowrap; }
  .ledger-label-row .total.over{ color:var(--over); }

  .month-nav{ display:flex; align-items:center; justify-content:center; gap:16px; font-size:14px; color:var(--muted); }
  .month-nav .cur{ color:var(--ink); font-weight:700; min-width:100px; text-align:center; }
  .month-nav .arrow{
    width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    border:1px solid var(--line); color:var(--muted-2); font-size:14px; background:var(--surface);
    cursor:pointer; transition:background 150ms var(--ease-out), transform 100ms var(--ease-out), border-color 150ms var(--ease-out);
  }
  .month-nav .arrow:hover{ border-color:var(--accent); color:var(--accent-ink); }
  .month-nav .arrow:active{ transform:scale(.92); }

  .ledger{ background:var(--surface); border:1px solid var(--line-soft); border-radius:16px; padding:16px 16px 14px; display:flex; flex-direction:column; gap:10px; }
  .ledger-label{ font-size:11.5px; color:var(--muted); }
  .ledger-amt{ font-size:21px; font-weight:700; }
  .ledger-amt .u{ font-size:12px; font-weight:600; color:var(--muted); margin-left:2px; }
  .ledger-track{ position:relative; height:14px; border-radius:8px; background:var(--line-soft); }
  .ledger-fill{ position:absolute; inset:0 auto 0 0; width:0%; border-radius:8px; transition:width 700ms var(--ease-out); }
  .ledger-foot{ display:flex; justify-content:space-between; font-size:11.5px; color:var(--muted-2); }
  .ledger-foot b{ font-weight:700; }

  .pace-badge{
    display:inline-flex; align-items:center; gap:5px; align-self:flex-start;
    font-size:12.5px; font-weight:700; padding:6px 11px; border-radius:100px;
  }
  .pace-badge.over{ background:color-mix(in srgb, var(--over) 18%, transparent); color:var(--over); }
  .pace-badge.daily{ background:var(--accent-soft); color:var(--accent-ink); }
  .pace-badge.daily b{ font-weight:700; }
  .ledger-empty{ font-size:12px; color:var(--muted-2); }

  .donut-card{ background:var(--surface); border:1px solid var(--line-soft); border-radius:16px; padding:14px; display:flex; gap:16px; align-items:center; }
  .donut{ width:82px; height:82px; border-radius:50%; flex:none; position:relative; }
  .donut::after{ content:""; position:absolute; inset:15px; border-radius:50%; background:var(--surface); }
  .donut-legend{ display:flex; flex-direction:column; gap:6px; flex:1; min-width:0; max-height:150px; overflow-y:auto; }
  .dl-row{ display:flex; align-items:center; gap:7px; font-size:11px; color:var(--muted); }
  .dl-row .dot{ width:8px; height:8px; border-radius:2.5px; flex:none; }
  .dl-row .name{ flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dl-row .pct{ color:var(--muted-2); }
  .donut-empty{ font-size:12px; color:var(--muted-2); padding:8px 0; }

  .chip-row{ display:flex; flex-wrap:wrap; gap:7px; }
  .chip{
    font-size:11.5px; padding:6px 12px; border-radius:100px; border:1px solid var(--line);
    color:var(--muted); white-space:nowrap; background:var(--surface); cursor:pointer;
    transition:background 160ms var(--ease-out), color 160ms var(--ease-out), border-color 160ms var(--ease-out);
  }
  .chip:hover{ border-color:var(--accent); }
  .chip.on{ border-color:var(--accent); color:#fff; background:var(--accent); font-weight:600; }
  .chip.dashed{ border-style:dashed; }
  .chip.on.fixed-on{ background:var(--fixed); border-color:var(--fixed); }
  .chip.on.income-on{ background:var(--pos); border-color:var(--pos); }

  .list-sum{ font-size:12px; color:var(--muted); text-align:right; padding:0 2px; }
  .list-sum b{ color:var(--ink); font-weight:700; }

  .mode-toggle{ display:flex; gap:4px; background:var(--surface-2); border-radius:11px; padding:4px; }
  .mode-btn{
    flex:1; border:none; background:none; color:var(--muted); font-size:12.5px; font-weight:600;
    padding:9px 8px; border-radius:8px; cursor:pointer;
    transition:background 160ms var(--ease-out), color 160ms var(--ease-out);
  }
  .mode-btn.on{ background:var(--surface); color:var(--ink); box-shadow:0 1px 3px var(--shadow); }
  .mode-btn[data-mode="income"].on{ color:var(--pos); }

  .list{ display:flex; flex-direction:column; border:1px solid var(--line-soft); border-radius:14px; overflow:hidden; background:var(--surface); }
  .row{ display:flex; align-items:center; gap:9px; padding:11px 13px; border-bottom:1px solid var(--line-soft); font-size:12.5px; transition:background 150ms var(--ease-out); }
  .row:hover{ background:var(--surface-2); }
  .row:last-child{ border-bottom:none; }
  .row .cat-dot{ width:8px; height:8px; border-radius:2.5px; flex:none; }
  .row .date{ color:var(--muted-2); width:34px; flex:none; }
  .row .name{ flex:1; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .amt{ font-weight:600; flex:none; }
  .row .rt{ display:flex; gap:8px; flex:none; margin-left:2px; }
  .row .rt span{ color:var(--muted-2); font-size:10.5px; cursor:pointer; white-space:nowrap; }
  .row .rt .edit:hover{ color:var(--accent-ink); }
  .row .rt .del:hover{ color:var(--over); }
  .list-empty{ padding:24px 12px; text-align:center; font-size:12.5px; color:var(--muted-2); }

  .fab{
    position:fixed; right:calc(50% - 210px + 16px); bottom:24px; width:52px; height:52px; border-radius:50%;
    background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center;
    font-size:24px; font-weight:300; box-shadow:0 8px 20px var(--accent-soft); border:none;
    cursor:pointer; transition:transform 160ms var(--ease-out), box-shadow 160ms var(--ease-out); z-index:5;
  }
  @media (max-width:452px){ .fab{ right:24px; } }
  .fab:hover{ transform:translateY(-2px); }
  .fab:active{ transform:scale(.94); }

  .overlay{ position:fixed; inset:0; z-index:20; display:none; }
  .overlay.open{ display:block; }
  .dim{ position:absolute; inset:0; background:rgba(15,18,16,.4); opacity:0; animation:dim-in 220ms var(--ease-out) forwards; }
  @keyframes dim-in{ to{opacity:1;} }
  .sheet{
    position:absolute; left:50%; transform:translateX(-50%) translateY(100%); bottom:0; width:100%; max-width:420px;
    background:var(--surface); border-radius:22px 22px 0 0; border:1px solid var(--line); padding:16px 16px 22px;
    display:flex; flex-direction:column; gap:13px; box-shadow:0 -10px 30px var(--shadow); max-height:88dvh; overflow-y:auto;
    animation:sheet-in 320ms var(--ease-out) forwards;
  }
  @keyframes sheet-in{ to{ transform:translateX(-50%) translateY(0); } }
  .sheet-handle{ width:36px; height:4px; border-radius:3px; background:var(--line); margin:0 auto 2px; }
  .sheet-title{ font-weight:700; font-size:14.5px; display:flex; justify-content:space-between; align-items:center; }
  .sheet-close{ color:var(--muted-2); cursor:pointer; font-size:13px; }

  .field{ display:flex; flex-direction:column; gap:6px; }
  .field label{ font-size:11px; color:var(--muted-2); font-weight:600; }
  .field input{
    height:38px; border-radius:10px; border:1px solid var(--line); background:var(--surface-2);
    padding:0 12px; font-size:12.5px; color:var(--ink); width:100%; outline:none;
    transition:border-color 150ms var(--ease-out);
  }
  .field input:focus{ border-color:var(--accent); }
  .field input.amt{ text-align:right; font-weight:700; font-size:17px; background:var(--surface); }

  .fixed-reveal{ display:flex; flex-direction:column; gap:7px; padding-left:12px; border-left:2px solid var(--fixed-soft); }
  .fixed-reveal label{ font-size:10.5px; color:var(--fixed); font-weight:600; }

  .btn-primary{
    height:42px; border-radius:11px; background:var(--accent); color:#fff; border:none;
    display:flex; align-items:center; justify-content:center; font-size:13.5px; font-weight:700;
    cursor:pointer; transition:transform 140ms var(--ease-out), background 150ms var(--ease-out); width:100%;
  }
  .btn-primary:hover{ background:var(--accent-ink); }
  .btn-primary:active{ transform:scale(.98); }

  .settings-sec{ display:flex; flex-direction:column; gap:9px; }
  .settings-sec .title{ font-size:12px; font-weight:700; }
  .settings-sec .hint{ font-size:10.5px; color:var(--muted-2); }
  .setting-row{ display:flex; align-items:center; justify-content:space-between; padding:9px 12px; border:1px solid var(--line-soft); border-radius:10px; font-size:12.5px; background:var(--surface); }
  .setting-row .name{ display:flex; align-items:center; gap:8px; }
  .setting-row .dot{ width:8px; height:8px; border-radius:2.5px; flex:none; }
  .setting-row .del{ color:var(--muted-2); cursor:pointer; font-size:11.5px; }
  .setting-row .del:hover{ color:var(--over); }
  .add-row{
    display:flex; align-items:center; justify-content:center; gap:6px; padding:10px;
    border:1px dashed var(--line); border-radius:10px; font-size:11.5px; color:var(--muted); background:none; width:100%;
    cursor:pointer; transition:border-color 150ms var(--ease-out), color 150ms var(--ease-out);
  }
  .add-row:hover{ border-color:var(--accent); color:var(--accent-ink); }

  .sync-row{ display:flex; gap:8px; }
  .sync-row input{ flex:1; }
  .sync-status{ font-size:10.5px; color:var(--muted-2); }

  @media (prefers-reduced-motion: reduce){ *{ animation-duration:1ms !important; transition-duration:1ms !important; } }
</style>
</head>
<body>

<div class="app" id="app">

  <div class="topbar">
    <div class="brand">생활비 가계부</div>
    <div class="icon-btn" onclick="openSettings()" aria-label="설정">⚙</div>
  </div>

  <div class="sync-indicator" id="syncIndicator"></div>

  <div class="month-nav">
    <button class="arrow" onclick="shiftMonth(-1)">‹</button>
    <span class="cur num" id="monthLabel"></span>
    <button class="arrow" onclick="shiftMonth(1)">›</button>
  </div>

  <div class="ledger" id="ledgerCard"></div>

  <div class="donut-card" id="donutCard"></div>

  <div class="chip-row" id="filterChips"></div>

  <div class="chip-row" id="payChips"></div>

  <div class="list-sum num" id="listSum"></div>

  <div class="list" id="expenseList"></div>

  <button class="fab" onclick="openAddSheet()" aria-label="지출 추가">+</button>

</div>

<!-- Add expense/income sheet -->
<div class="overlay" id="addOverlay">
  <div class="dim" onclick="closeAddSheet()"></div>
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title"><span id="addSheetTitle">지출 추가</span><span class="sheet-close" onclick="closeAddSheet()">닫기</span></div>

    <div class="mode-toggle" id="modeToggle">
      <button type="button" class="mode-btn on" data-mode="expense" onclick="setEntryMode('expense')">지출</button>
      <button type="button" class="mode-btn" data-mode="income" onclick="setEntryMode('income')">수입 (앱테크 등)</button>
    </div>

    <div class="field">
      <label>날짜</label>
      <input type="date" id="fDate">
    </div>
    <div class="field">
      <label>금액</label>
      <input type="text" id="fAmount" class="amt" placeholder="0" inputmode="numeric" oninput="formatAmountField(this)">
    </div>
    <div class="field">
      <label id="fNameLabel">항목명</label>
      <input type="text" id="fName" placeholder="예: 이마트 장보기">
    </div>
    <div class="field" id="catField">
      <label>카테고리</label>
      <div class="chip-row" id="varChipRow"></div>
    </div>
    <div class="field" id="payField">
      <label>결제수단</label>
      <div class="chip-row" id="payChipRow"></div>
    </div>
    <div class="hint" id="incomeHint" style="display:none;">예산에는 포함되지 않고, 상단 총액에만 더해져요 (생활비통장에 합쳐지는 돈)</div>

    <button class="btn-primary" onclick="saveEntry()">저장</button>
  </div>
</div>

<!-- Settings sheet -->
<div class="overlay" id="settingsOverlay">
  <div class="dim" onclick="closeSettings()"></div>
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title"><span>설정</span><span class="sheet-close" onclick="closeSettings()">닫기</span></div>

    <div class="settings-sec">
      <div class="title" id="budgetTitle">이번 달 입금</div>
      <div class="field"><label>예진</label><input type="number" id="fDepYj" class="amt" placeholder="0" inputmode="numeric" onchange="saveDeposit()"></div>
      <div class="field"><label>재하</label><input type="number" id="fDepJh" class="amt" placeholder="0" inputmode="numeric" onchange="saveDeposit()"></div>
      <div class="hint" id="depHint">두 사람 입금액의 합이 이번 달 예산이에요 (보고 있는 달 기준)</div>
    </div>

    <div class="settings-sec">
      <div class="title">카테고리</div>
      <div id="catList"></div>
      <button class="add-row" onclick="addCategory()">+ 카테고리 추가</button>
    </div>

    <div class="settings-sec">
      <div class="title">구글시트 동기화</div>
      <div class="sync-row">
        <input type="text" id="fGasUrl" placeholder="GAS 웹앱 URL 붙여넣기">
      </div>
      <div class="sync-row">
        <input type="password" id="fGasKey" placeholder="공유 키 (두 사람이 같은 값)" autocomplete="off">
        <button class="btn-primary" style="width:auto; padding:0 14px;" onclick="saveGasUrl()">저장</button>
      </div>
      <div class="sync-row">
        <button class="btn-primary" id="btnPush" style="background:var(--accent);" onclick="manualPush()">지금 업로드</button>
        <button class="btn-primary" id="btnPull" style="background:var(--muted-2);" onclick="manualPull()">지금 불러오기</button>
      </div>
      <div class="sync-status" id="syncStatus">동기화 안 됨 (로컬에만 저장)</div>
      <div class="hint">저장하면 바로 올라가요. 올라가지 못한 변경은 이 기기에 남아 있다가 다음에 다시 올려요</div>
    </div>

  </div>
</div>

<script>
'use strict';

// ── 상수 ────────────────────────────────────────────────────────────────
var DEFAULT_GAS_URL = 'https://script.google.com/macros/s/AKfycbzKKbZkEZL6T0I1NRdQQZX6bUAFDR8POHyDodR_PaxSdyk0lVRmUdruQj79_mE7B-dt/exec';
var STORAGE_KEY = 'lc_data';
var GAS_URL_KEY = 'lc_gas_url';
var GAS_KEY_KEY = 'lc_gas_key';
var PENDING_KEY = 'lc_pending';
var SYNCED_KEY = 'lc_synced';
var LAST_PAY_KEY = 'lc_last_pay';

var COLOR_COUNT = 16; // --cc1..--cc16
var DEFAULT_CATS = ['주거','공과금','식비','생필품','의류·취미','교통비','구독료','폰요금','보험','의료비','경조사','선물','저축','기타'];
// 예전 카테고리를 새 목록으로 옮길 때의 이름 변환. 여기에 없는 이름(예: 데이트)은 그대로 목록에 추가됨
var CAT_RENAME = { '월세':'주거', '관리비':'주거', '교통':'교통비', '기타고정비':'기타' };
var PAYS = ['신용카드','체크카드','현금','계좌이체'];

// ── 상태 ────────────────────────────────────────────────────────────────
var D = normalize(load() || {});
var pending = loadPending(); // 아직 구글시트에 확인되지 않은 변경 목록 (기기에 저장됨)

var today = new Date();
var viewMonth = ym(today);
var activeFilter = 'all';
var activePay = 'all';
var entryMode = 'expense';
var editingId = null; // null이면 새 항목 추가, 값이 있으면 해당 id의 항목을 수정 중
var selectedCat = null;
var selectedPay = null;
var lastPullAt = 0;

// ── 유틸 ────────────────────────────────────────────────────────────────
function ym(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function daysInMonth(ymStr){ var p=ymStr.split('-'); return new Date(Number(p[0]), Number(p[1]), 0).getDate(); }
function fmtWon(n){ return Math.round(n).toLocaleString() + '원'; }
function rawAmount(str){ return Number(String(str||'').replace(/[^0-9]/g,'')); }
function formatAmountField(el){
  var digits = el.value.replace(/[^0-9]/g,'');
  var caretFromEnd = el.value.length - el.selectionEnd;
  el.value = digits ? Number(digits).toLocaleString() : '';
  var pos = el.value.length - caretFromEnd;
  el.setSelectionRange(pos, pos);
}
function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function escapeHtml(s){ var d=document.createElement('div'); d.textContent = s==null?'':s; return d.innerHTML; }
// onclick 등 속성 안에 이름을 넣을 때 사용 (따옴표가 들어간 이름이 속성을 깨지 않게)
function attr(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function monthLabel(ymStr){
  var p = ymStr.split('-');
  return p[0] + '년 ' + Number(p[1]) + '월';
}

function shiftMonth(delta){
  var p = viewMonth.split('-');
  var d = new Date(Number(p[0]), Number(p[1]) - 1 + delta, 1);
  viewMonth = ym(d);
  activeFilter = 'all';
  activePay = 'all';
  renderAll();
}

function expensesForMonth(ymStr){
  return D.expenses.filter(function(e){ return e.date.slice(0,7) === ymStr; });
}

function incomeForMonth(ymStr){
  return D.income.filter(function(e){ return e.date.slice(0,7) === ymStr; });
}

function budgetForMonth(ymStr){ return D.budgets[ymStr] || 0; }

// ── 데이터 정리 (옛 구조 → 새 구조) ───────────────────────────────────────
// 로컬 저장본과 구글시트에서 받은 데이터 모두 이 함수를 거침. 이미 새 구조면 아무것도 바꾸지 않음
function normalize(d){
  d = d || {};
  d.expenses = d.expenses || [];
  d.income = d.income || [];
  d.budgets = d.budgets || {};
  d.deposits = d.deposits || {};
  var c = d.cats || {};
  if(!(c.list && c.list.length)){
    // 예전 구조(변동비 목록 + 고정비 세부카테고리)를 하나의 목록으로 합침
    d.expenses.forEach(function(e){
      if(e.cat === '고정비') e.cat = e.sub || '기타고정비';
      e.cat = CAT_RENAME[e.cat] || e.cat;
    });
    var list = DEFAULT_CATS.slice();
    (c.variable || []).concat(c.fixed || []).forEach(function(n){
      var m = CAT_RENAME[n] || n;
      if(list.indexOf(m) < 0) list.push(m);
    });
    c = { list: list };
  }
  d.cats = { list: c.list };
  d.expenses.forEach(function(e){
    if(e.pay == null) e.pay = '';
    if(e.sub == null) e.sub = '';
  });
  d._savedAt = d._savedAt || 0;
  return d;
}

// ── 변경 기록과 적용 ──────────────────────────────────────────────────────
// 모든 변경은 "변경 기록(op)"으로 남김. 구글시트에 올릴 때는 최신 데이터를 받아서 그 위에 이 기록들을 다시 적용하므로,
// 앱을 오래 열어둔 상태에서 저장해도 상대가 그사이 입력한 내역을 덮어쓰지 않음
function upsert(arr, item){
  var i = arr.findIndex(function(x){ return x.id === item.id; });
  if(i >= 0) arr[i] = item; else arr.push(item);
}

function applyOp(d, op){
  if(op.t === 'ex') upsert(d.expenses, op.item);
  else if(op.t === 'exDel') d.expenses = d.expenses.filter(function(x){ return x.id !== op.id; });
  else if(op.t === 'in') upsert(d.income, op.item);
  else if(op.t === 'inDel') d.income = d.income.filter(function(x){ return x.id !== op.id; });
  else if(op.t === 'dep'){
    if(op.yj || op.jh){ d.deposits[op.ym] = { yj: op.yj, jh: op.jh }; d.budgets[op.ym] = op.yj + op.jh; }
    else { delete d.deposits[op.ym]; d.budgets[op.ym] = 0; }
  }
  else if(op.t === 'bud'){ if(!d.deposits[op.ym]) d.budgets[op.ym] = op.v; } // 예전 방식의 월 예산 (입금액 없는 달만)
  else if(op.t === 'cats') d.cats.list = op.list.slice(); // 옛 데이터를 처음 올릴 때(seedPending)만 사용
  else if(op.t === 'catAdd'){ if(d.cats.list.indexOf(op.name) < 0) d.cats.list.push(op.name); }
  else if(op.t === 'catDel') d.cats.list = d.cats.list.filter(function(c){ return c !== op.name; });
}

// 변경 한 건을 적용·저장하고 구글시트에 올림. 입력이 막힌 상태면 false
function commit(op){
  if(!canEdit()) return false;
  applyOp(D, op);
  pending.push(op);
  save();
  renderAll();
  flush();
  return true;
}

// ── 저장 / 동기화 ─────────────────────────────────────────────────────────
function save(){
  D._savedAt = Date.now();
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(D));
    localStorage.setItem(PENDING_KEY, JSON.stringify(pending));
  }catch(e){}
}
function load(){
  try{ var raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
function loadPending(){
  try{ return JSON.parse(localStorage.getItem(PENDING_KEY)) || []; }
  catch(e){ return []; }
}
function gasUrl(){ return localStorage.getItem(GAS_URL_KEY) || DEFAULT_GAS_URL; }
function gasKey(){ return localStorage.getItem(GAS_KEY_KEY) || ''; }
function lastPushAt(){ return Number(localStorage.getItem('lc_last_push_at')) || 0; }

// 구글시트에서 한 번도 최신 데이터를 받아온 적 없는 기기는 입력을 막음
// (빈 데이터로 시작한 기기가 구글시트를 덮어쓰는 사고 방지). 이미 한 번 받아온 기기는 연결이 끊겨도 입력할 수 있음
function canEdit(){
  if(!gasUrl() || localStorage.getItem(SYNCED_KEY)) return true;
  alert('구글시트에서 최신 데이터를 먼저 불러와야 입력할 수 있어요. 잠시 후 다시 시도하거나, 설정에서 주소와 공유 키를 확인해주세요.');
  return false;
}

function saveGasUrl(){
  localStorage.setItem(GAS_URL_KEY, document.getElementById('fGasUrl').value.trim());
  localStorage.setItem(GAS_KEY_KEY, document.getElementById('fGasKey').value.trim());
  localStorage.removeItem(SYNCED_KEY); // 주소나 키가 바뀌면 다시 받아오기 전까지 입력을 막음
  renderSyncStatus();
  pull().catch(function(e){ setSyncIndicator(syncErrorText(e), true); });
}

function timedFetch(url, opts){
  var ctrl = new AbortController();
  var t = setTimeout(function(){ ctrl.abort(); }, 30000);
  opts = opts || {};
  opts.signal = ctrl.signal;
  return fetch(url, opts).then(function(r){ clearTimeout(t); return r.json(); }, function(e){ clearTimeout(t); throw e; });
}

function fetchRemote(){
  var url = gasUrl() + (gasUrl().indexOf('?') >= 0 ? '&' : '?') + 'key=' + encodeURIComponent(gasKey());
  return timedFetch(url).then(function(r){
    if(!r || r.error || !r.expenses) throw new Error((r && r.error) || 'bad response');
    return normalize(r);
  });
}

function postRemote(d){
  var body = JSON.stringify(Object.assign({}, d, { _key: gasKey() }));
  return timedFetch(gasUrl(), { method:'POST', headers:{ 'Content-Type':'text/plain' }, body: body }).then(function(r){
    if(!r || !r.ok) throw new Error((r && r.error) || 'bad response');
  });
}

function syncErrorText(e){
  var m = e && e.message;
  if(m === 'unauthorized') return '공유 키가 맞지 않아요 (설정에서 확인)';
  if(m === 'shrink') return '데이터가 크게 줄어서 업로드를 막았어요';
  return '구글시트 연결 실패 (변경은 이 기기에 남아 있어요)';
}

// 올리기: 최신 데이터를 받아서 → 대기 중인 변경을 그 위에 적용하고 → 올림. 동시에 하나만 실행하고, 실행 중에 쌓인 변경은 끝난 뒤 이어서 올림
var flushP = null, flushAgain = false;
function flush(){
  if(!gasUrl() || !pending.length) return Promise.resolve();
  if(flushP){ flushAgain = true; return flushP; }
  flushP = runFlush().then(function(){
    flushP = null;
    if(flushAgain){ flushAgain = false; return flush(); }
  });
  return flushP;
}

function runFlush(){
  var sent = pending.length;
  setSyncIndicator('<span class="dot"></span>구글시트에 업로드 중...');
  return fetchRemote().then(function(base){
    pending.slice(0, sent).forEach(function(op){ applyOp(base, op); });
    base._savedAt = Date.now();
    return postRemote(base).then(function(){
      pending = pending.slice(sent);
      D = base;
      pending.forEach(function(op){ applyOp(D, op); }); // 올리는 동안 새로 쌓인 변경은 화면에 계속 보이게 다시 적용
      localStorage.setItem(SYNCED_KEY, '1');
      localStorage.setItem('lc_last_push_at', String(Date.now()));
      save();
      renderAll();
      renderSyncStatus();
      setSyncIndicator('구글시트에 저장했어요', true);
    });
  }).catch(function(e){
    setSyncIndicator(syncErrorText(e), true);
    renderSyncStatus();
  });
}

// 불러오기: 대기 중인 변경은 그대로 유지한 채 구글시트 최신 데이터를 반영함 (앱을 열 때, 화면에 다시 돌아올 때, 버튼을 눌렀을 때)
function pull(){
  if(!gasUrl()) return Promise.resolve();
  if(flushP) return flushP;
  lastPullAt = Date.now();
  return fetchRemote().then(function(remote){
    // 새 버전으로 처음 여는 기기에 아직 올리지 못한 로컬 변경이 있으면 대기 목록에 넣어서 잃지 않게 함
    if(!localStorage.getItem(SYNCED_KEY) && !pending.length && (D.expenses.length || D.income.length) && (D._savedAt || 0) > (remote._savedAt || 0)){
      seedPending();
    }
    D = remote;
    pending.forEach(function(op){ applyOp(D, op); });
    localStorage.setItem(SYNCED_KEY, '1');
    save();
    renderAll();
    renderSyncStatus();
    if(pending.length) flush();
  });
}

function seedPending(){
  D.expenses.forEach(function(e){ pending.push({ t:'ex', item:e }); });
  D.income.forEach(function(e){ pending.push({ t:'in', item:e }); });
  Object.keys(D.budgets).forEach(function(m){ pending.push({ t:'bud', ym:m, v:D.budgets[m] }); });
  pending.push({ t:'cats', list:D.cats.list.slice() });
}

function setSyncIndicator(html, autoHide){
  var el = document.getElementById('syncIndicator');
  if(!el) return;
  if(!html){ el.classList.remove('show'); el.innerHTML = ''; return; }
  el.innerHTML = html;
  el.classList.add('show');
  clearTimeout(setSyncIndicator._t);
  if(autoHide){
    setSyncIndicator._t = setTimeout(function(){ el.classList.remove('show'); }, 2200);
  }
}

function manualPush(){
  if(!gasUrl()){ alert('먼저 GAS 웹앱 URL을 입력하고 저장해주세요'); return; }
  if(!pending.length){ alert('올릴 변경사항이 없어요'); return; }
  var btn = document.getElementById('btnPush');
  btn.textContent = '업로드 중...'; btn.disabled = true;
  flush().then(function(){
    if(pending.length) alert('업로드에 실패했어요. 주소와 공유 키를 확인해주세요.');
  }).finally(function(){ btn.textContent = '지금 업로드'; btn.disabled = false; renderSyncStatus(); });
}

function manualPull(){
  if(!gasUrl()){ alert('먼저 GAS 웹앱 URL을 입력하고 저장해주세요'); return; }
  var btn = document.getElementById('btnPull');
  btn.textContent = '불러오는 중...'; btn.disabled = true;
  pull().catch(function(e){ alert(syncErrorText(e)); }).finally(function(){ btn.textContent = '지금 불러오기'; btn.disabled = false; });
}

function renderSyncStatus(){
  var el = document.getElementById('syncStatus');
  if(!el) return;
  if(!gasUrl()){ el.textContent = '동기화 안 됨 (로컬에만 저장)'; return; }
  var t = lastPushAt();
  var s = t ? ('마지막 업로드: ' + new Date(t).toLocaleString('ko-KR')) : '아직 업로드한 적 없어요';
  if(pending.length) s += ' · 올리지 못한 변경 ' + pending.length + '건';
  el.textContent = s;
}

// ── 렌더 ────────────────────────────────────────────────────────────────
function renderAll(){
  document.getElementById('monthLabel').textContent = monthLabel(viewMonth);
  renderLedger();
  renderDonut();
  renderFilterChips();
  renderPayChips();
  renderExpenseList();
}

function renderLedger(){
  var list = expensesForMonth(viewMonth);
  var spent = list.reduce(function(s,e){ return s + Number(e.amount||0); }, 0);
  var budget = budgetForMonth(viewMonth);
  // 수입(앱테크 등)은 예산과 별개라서 게이지/남은 돈 계산엔 안 들어가고, 위쪽 라벨에만 참고로 표시함
  var incomeSum = incomeForMonth(viewMonth).reduce(function(s,e){ return s + Number(e.amount||0); }, 0);
  var el = document.getElementById('ledgerCard');

  if(!budget){
    var totalNoBudget = incomeSum - spent;
    el.innerHTML =
      '<div class="ledger-label ledger-label-row"><span>이번 달 입금액이 아직 없어요</span><span class="total num' + (totalNoBudget < 0 ? ' over' : '') + '">총액 ' + fmtWon(totalNoBudget) + '</span></div>' +
      '<div class="ledger-amt num">' + fmtWon(spent) + '<span class="u">썼어요</span></div>' +
      '<div class="ledger-empty">설정에서 이번 달 입금액을 입력하면 게이지가 표시돼요</div>';
    return;
  }

  var pct = Math.min(999, Math.round(spent / budget * 100));
  var isCurrentMonth = viewMonth === ym(today);

  // 날짜 페이스(지난 비율 vs 오늘 날짜 비율) 비교는 고정비처럼 뭉텅이로 나가는 지출이 있으면
  // 실제 습관과 무관하게 튀어서 "이상하게" 느껴진다는 피드백으로 폐기함(2026-08-07).
  // 대신 "오늘부터 남은 기간 동안 하루에 얼마씩 쓸 수 있는지"를 그때그때 다시 계산해서 보여줌 —
  // 판정(빠르다/느리다)이 아니라 정보라서, 고정비가 갑자기 나가서 하루 예산이 훅 줄어도 자연스러움
  var fillColor = 'var(--pos)';
  var badgeHtml = '';
  if(spent > budget){
    fillColor = 'var(--over)';
    badgeHtml = '<div class="pace-badge over">▲ 예산 초과</div>';
  } else if(isCurrentMonth){
    var daysRemaining = daysInMonth(viewMonth) - today.getDate() + 1;
    var dailyAllowance = (budget - spent) / daysRemaining;
    badgeHtml = '<div class="pace-badge daily">오늘부터 하루 <b class="num">' + fmtWon(dailyAllowance) + '</b> 쓸 수 있어요</div>';
  }

  var budgetLabel = '이번 달 예산 <span class="num">' + budget.toLocaleString() + '</span>원';
  if(incomeSum > 0){
    budgetLabel += ' <span style="color:var(--pos);">+ 수입 ' + incomeSum.toLocaleString() + '원</span>';
  }
  var total = budget + incomeSum - spent; // 통장에 실제 남아있어야 할 금액 (실제 통장 잔액과 맞춰보는 용도)
  var dep = D.deposits[viewMonth];
  var depHtml = dep ? '<div class="ledger-label num">입금 예진 ' + dep.yj.toLocaleString() + '원 + 재하 ' + dep.jh.toLocaleString() + '원</div>' : '';

  el.innerHTML =
    '<div class="ledger-label ledger-label-row"><span>' + budgetLabel + '</span><span class="total num' + (total < 0 ? ' over' : '') + '">총액 ' + fmtWon(total) + '</span></div>' +
    depHtml +
    '<div class="ledger-amt num">' + fmtWon(spent) + '<span class="u">썼어요</span></div>' +
    badgeHtml +
    '<div class="ledger-track">' +
      '<div class="ledger-fill" style="width:0%; background:' + fillColor + ';" id="ledgerFillEl"></div>' +
    '</div>' +
    '<div class="ledger-foot num">' +
      '<span>' + fmtWon(Math.max(0, budget - spent)) + ' 남음</span>' +
      '<span>' + pct + '% 사용</span>' +
    '</div>';

  requestAnimationFrame(function(){
    var fillEl = document.getElementById('ledgerFillEl');
    if(fillEl) fillEl.style.width = Math.min(100, pct) + '%';
  });
}

// 색상은 카테고리 목록의 순서(index)로 결정됨. 목록에 없는(삭제된) 카테고리의 옛 지출은 회색으로 표시
function catColor(name){
  var idx = D.cats.list.indexOf(name);
  return idx < 0 ? cssVar('--muted-2') : cssVar('--cc' + (idx % COLOR_COUNT + 1));
}

function categoryBreakdown(){
  var list = expensesForMonth(viewMonth);
  var total = list.reduce(function(s,e){ return s + Number(e.amount||0); }, 0);
  var buckets = {};
  list.forEach(function(e){ buckets[e.cat] = (buckets[e.cat] || 0) + Number(e.amount||0); });

  var rows = Object.keys(buckets).map(function(label){
    return { label:label, amount:buckets[label], pct: total ? Math.round(buckets[label]/total*100) : 0, color: catColor(label) };
  }).sort(function(a,b){ return b.amount - a.amount; });

  return { total:total, rows:rows };
}

function renderDonut(){
  var el = document.getElementById('donutCard');
  var data = categoryBreakdown();
  if(!data.rows.length){
    el.innerHTML = '<div class="donut-empty">아직 이번 달 지출이 없어요</div>';
    return;
  }
  // 조각 경계는 반올림하지 않은 비율로 계산해야 합이 100%를 넘지 않음
  var gradParts = [];
  var acc = 0;
  data.rows.forEach(function(r){
    var start = acc;
    acc += r.amount / data.total * 100;
    gradParts.push(r.color + ' ' + start + '% ' + acc + '%');
  });

  var legend = data.rows.map(function(r){
    return '<div class="dl-row"><span class="dot" style="background:' + r.color + ';"></span><span class="name">' + escapeHtml(r.label) + '</span><span class="pct num">' + r.pct + '% · ' + fmtWon(r.amount) + '</span></div>';
  }).join('');

  el.innerHTML =
    '<div class="donut" style="background:conic-gradient(' + gradParts.join(',') + ');"></div>' +
    '<div class="donut-legend">' + legend + '</div>';
}

// 필터 칩에는 카테고리 목록과, 목록엔 없지만 이번 달 지출에 쓰인 카테고리(삭제된 것)도 함께 보여줌
function renderFilterChips(){
  var el = document.getElementById('filterChips');
  var names = D.cats.list.slice();
  expensesForMonth(viewMonth).forEach(function(e){ if(names.indexOf(e.cat) < 0) names.push(e.cat); });
  var chips = ['<span class="chip ' + (activeFilter==='all'?'on':'') + '" onclick="setFilter(\'all\')">전체</span>'];
  names.forEach(function(c){
    chips.push('<span class="chip ' + (activeFilter===c?'on':'') + '" data-n="' + attr(c) + '" onclick="setFilter(this.dataset.n)">' + escapeHtml(c) + '</span>');
  });
  chips.push('<span class="chip ' + (activeFilter==='수입'?'on income-on':'') + '" onclick="setFilter(\'수입\')">수입</span>');
  el.innerHTML = chips.join('');
}

function setFilter(f){ activeFilter = f; renderFilterChips(); renderExpenseList(); }

// 결제수단별 이번 달 합계. 칩을 누르면 그 결제수단 지출만 목록에 보여줌
function renderPayChips(){
  var el = document.getElementById('payChips');
  var sums = {};
  expensesForMonth(viewMonth).forEach(function(e){
    var p = e.pay || '미지정';
    sums[p] = (sums[p] || 0) + Number(e.amount||0);
  });
  el.innerHTML = PAYS.concat(['미지정']).filter(function(p){ return sums[p]; }).map(function(p){
    return '<span class="chip ' + (activePay===p?'on':'') + '" data-n="' + attr(p) + '" onclick="setPay(this.dataset.n)">' + p + ' <span class="num">' + sums[p].toLocaleString() + '</span></span>';
  }).join('');
}

function setPay(p){ activePay = activePay === p ? 'all' : p; renderPayChips(); renderExpenseList(); }

function expenseRowHtml(e){
  var d = e.date.split('-');
  return '<div class="row">' +
    '<span class="cat-dot" style="background:' + catColor(e.cat) + ';"></span>' +
    '<span class="date num">' + Number(d[1]) + '/' + Number(d[2]) + '</span>' +
    '<span class="name">' + escapeHtml(e.name) + '</span>' +
    '<span class="amt num">' + fmtWon(e.amount) + '</span>' +
    '<span class="rt"><span class="edit" onclick="openEditExpense(\'' + e.id + '\')">수정</span><span class="del" onclick="tryDeleteExpense(\'' + e.id + '\')">삭제</span></span>' +
  '</div>';
}

function incomeRowHtml(e){
  var d = e.date.split('-');
  return '<div class="row">' +
    '<span class="cat-dot" style="background:var(--pos);"></span>' +
    '<span class="date num">' + Number(d[1]) + '/' + Number(d[2]) + '</span>' +
    '<span class="name">' + escapeHtml(e.name || '수입') + '</span>' +
    '<span class="amt num" style="color:var(--pos);">+' + fmtWon(e.amount) + '</span>' +
    '<span class="rt"><span class="edit" onclick="openEditIncome(\'' + e.id + '\')">수정</span><span class="del" onclick="tryDeleteIncome(\'' + e.id + '\')">삭제</span></span>' +
  '</div>';
}

function byDateDesc(a,b){ return b.date.localeCompare(a.date) || b.id.localeCompare(a.id); }

function renderExpenseList(){
  var el = document.getElementById('expenseList');
  var sumEl = document.getElementById('listSum');

  // "수입" 칩: 수입만 보여줌
  if(activeFilter === '수입'){
    var incomeOnly = incomeForMonth(viewMonth).sort(byDateDesc);
    var incomeSumFiltered = incomeOnly.reduce(function(s,e){ return s + Number(e.amount||0); }, 0);
    sumEl.innerHTML = incomeOnly.length ? ('합계 <b>' + fmtWon(incomeSumFiltered) + '</b>') : '';
    el.innerHTML = incomeOnly.length ? incomeOnly.map(incomeRowHtml).join('') : '<div class="list-empty">이번 달 수입 내역이 없어요</div>';
    return;
  }

  // "전체"(결제수단 필터 없음): 지출 + 수입을 날짜순으로 섞어서 보여줌 (합계는 안 보여줌 — 이미 예산 카드에 표시됨)
  // 카테고리나 결제수단 필터가 켜져 있으면: 조건에 맞는 지출만 (수입은 카테고리/결제수단이 없어서 제외) — 그 합계를 보여줌
  var filtered = activeFilter !== 'all' || activePay !== 'all';
  var filteredExpenses = expensesForMonth(viewMonth).filter(function(e){
    if(activeFilter !== 'all' && e.cat !== activeFilter) return false;
    if(activePay !== 'all' && (e.pay || '미지정') !== activePay) return false;
    return true;
  });
  var expenseRows = filteredExpenses.map(function(e){ return { date: e.date, id: e.id, html: expenseRowHtml(e) }; });

  var incomeRows = filtered
    ? []
    : incomeForMonth(viewMonth).map(function(e){ return { date: e.date, id: e.id, html: incomeRowHtml(e) }; });

  if(!filtered){
    sumEl.innerHTML = '';
  } else {
    var catSum = filteredExpenses.reduce(function(s,e){ return s + Number(e.amount||0); }, 0);
    sumEl.innerHTML = filteredExpenses.length ? ('합계 <b>' + fmtWon(catSum) + '</b>') : '';
  }

  var rows = expenseRows.concat(incomeRows).sort(byDateDesc);

  el.innerHTML = rows.length ? rows.map(function(r){ return r.html; }).join('') : '<div class="list-empty">해당하는 내역이 없어요</div>';
}

function tryDeleteExpense(id){
  if(!canEdit()) return;
  var e = D.expenses.find(function(x){ return x.id === id; });
  if(!e) return;
  if(confirm(e.name + ' (' + fmtWon(e.amount) + ') 삭제할까요?')) commit({ t:'exDel', id:id });
}

function tryDeleteIncome(id){
  if(!canEdit()) return;
  var e = D.income.find(function(x){ return x.id === id; });
  if(!e) return;
  if(confirm((e.name || '수입') + ' (+' + fmtWon(e.amount) + ') 삭제할까요?')) commit({ t:'inDel', id:id });
}

// ── 지출/수입 추가 시트 ──────────────────────────────────────────────────
function openAddSheet(){
  if(!canEdit()) return;
  editingId = null;
  document.getElementById('fDate').value = todayStr();
  document.getElementById('fAmount').value = '';
  document.getElementById('fName').value = '';
  selectedCat = null;
  selectedPay = localStorage.getItem(LAST_PAY_KEY) || PAYS[0];
  renderCatChips();
  renderPayPicker();
  document.getElementById('modeToggle').style.display = 'flex';
  setEntryMode('expense');
  document.getElementById('addOverlay').classList.add('open');
}
function closeAddSheet(){ document.getElementById('addOverlay').classList.remove('open'); editingId = null; }

function openEditExpense(id){
  if(!canEdit()) return;
  var e = D.expenses.find(function(x){ return x.id === id; });
  if(!e) return;
  editingId = id;
  document.getElementById('fDate').value = e.date;
  document.getElementById('fAmount').value = Number(e.amount).toLocaleString();
  document.getElementById('fName').value = e.name;
  selectedCat = e.cat;
  selectedPay = e.pay || null;
  renderCatChips();
  renderPayPicker();
  document.getElementById('modeToggle').style.display = 'none';
  setEntryMode('expense');
  document.getElementById('addOverlay').classList.add('open');
}

function openEditIncome(id){
  if(!canEdit()) return;
  var e = D.income.find(function(x){ return x.id === id; });
  if(!e) return;
  editingId = id;
  document.getElementById('fDate').value = e.date;
  document.getElementById('fAmount').value = Number(e.amount).toLocaleString();
  document.getElementById('fName').value = e.name || '';
  document.getElementById('modeToggle').style.display = 'none';
  setEntryMode('income');
  document.getElementById('addOverlay').classList.add('open');
}

function setEntryMode(mode){
  entryMode = mode;
  document.querySelectorAll('#modeToggle .mode-btn').forEach(function(b){
    b.classList.toggle('on', b.getAttribute('data-mode') === mode);
  });

  var isIncome = mode === 'income';
  var isEditing = !!editingId;
  document.getElementById('addSheetTitle').textContent = isEditing
    ? (isIncome ? '수입 수정' : '지출 수정')
    : (isIncome ? '수입 추가' : '지출 추가');
  document.getElementById('fNameLabel').textContent = isIncome ? '출처 (선택)' : '항목명';
  document.getElementById('fName').placeholder = isIncome ? '예: 캐시워크, 오늘의집 적립' : '예: 이마트 장보기';
  document.getElementById('catField').style.display = isIncome ? 'none' : 'flex';
  document.getElementById('payField').style.display = isIncome ? 'none' : 'flex';
  document.getElementById('incomeHint').style.display = isIncome ? 'block' : 'none';
}

// 수정 중인 지출의 카테고리가 목록에서 삭제된 이름이어도 선택된 채로 보이게 함
function renderCatChips(){
  var names = D.cats.list.slice();
  if(selectedCat && names.indexOf(selectedCat) < 0) names.push(selectedCat);
  document.getElementById('varChipRow').innerHTML = names.map(function(c){
    return '<span class="chip ' + (selectedCat===c?'on':'') + '" data-n="' + attr(c) + '" onclick="pickCat(this.dataset.n)">' + escapeHtml(c) + '</span>';
  }).join('');
}
function pickCat(c){ selectedCat = c; renderCatChips(); }

function renderPayPicker(){
  document.getElementById('payChipRow').innerHTML = PAYS.map(function(p){
    return '<span class="chip ' + (selectedPay===p?'on':'') + '" data-n="' + attr(p) + '" onclick="pickPay(this.dataset.n)">' + p + '</span>';
  }).join('');
}
function pickPay(p){ selectedPay = p; renderPayPicker(); }

function saveEntry(){
  var date = document.getElementById('fDate').value;
  var amount = rawAmount(document.getElementById('fAmount').value);
  var name = document.getElementById('fName').value.trim();

  if(!date){ alert('날짜를 선택해주세요'); return; }
  if(!amount || amount <= 0){ alert('금액을 입력해주세요'); return; }

  var op;
  if(entryMode === 'income'){
    op = { t:'in', item:{ id: editingId || uid(), date: date, amount: amount, name: name } };
  } else {
    if(!name){ alert('항목명을 입력해주세요'); return; }
    if(!selectedCat){ alert('카테고리를 선택해주세요'); return; }
    // 결제수단이 비어 있는 옛 지출은 수정할 때 비워둔 채로 저장해도 됨
    if(!selectedPay && !editingId){ alert('결제수단을 선택해주세요'); return; }
    op = { t:'ex', item:{ id: editingId || uid(), date: date, amount: amount, name: name, cat: selectedCat, sub: '', pay: selectedPay || '' } };
  }

  viewMonth = date.slice(0,7);
  if(!commit(op)) return;
  if(op.t === 'ex' && selectedPay) localStorage.setItem(LAST_PAY_KEY, selectedPay);
  closeAddSheet();
}

// ── 설정 시트 ───────────────────────────────────────────────────────────
function openSettings(){
  document.getElementById('budgetTitle').textContent = monthLabel(viewMonth) + ' 입금';
  var dep = D.deposits[viewMonth] || {};
  document.getElementById('fDepYj').value = dep.yj || '';
  document.getElementById('fDepJh').value = dep.jh || '';
  var legacy = D.budgets[viewMonth] && !D.deposits[viewMonth];
  document.getElementById('depHint').textContent = legacy
    ? ('예전에 입력한 예산 ' + D.budgets[viewMonth].toLocaleString() + '원이 적용 중이에요. 입금액을 입력하면 두 사람 합계로 바뀌어요')
    : '두 사람 입금액의 합이 이번 달 예산이에요 (보고 있는 달 기준)';
  document.getElementById('fGasUrl').value = gasUrl();
  document.getElementById('fGasKey').value = gasKey();
  renderSyncStatus();
  renderCatSettingsLists();
  document.getElementById('settingsOverlay').classList.add('open');
}
function closeSettings(){ document.getElementById('settingsOverlay').classList.remove('open'); renderAll(); }

function saveDeposit(){
  var yj = Number(document.getElementById('fDepYj').value) || 0;
  var jh = Number(document.getElementById('fDepJh').value) || 0;
  commit({ t:'dep', ym:viewMonth, yj:yj, jh:jh });
}

function renderCatSettingsLists(){
  document.getElementById('catList').innerHTML = D.cats.list.map(function(c){
    return '<div class="setting-row"><span class="name"><span class="dot" style="background:' + catColor(c) + ';"></span>' + escapeHtml(c) + '</span><span class="del" data-n="' + attr(c) + '" onclick="removeCategory(this.dataset.n)">삭제</span></div>';
  }).join('');
}

function addCategory(){
  var name = prompt('추가할 카테고리 이름');
  if(!name) return;
  name = name.trim();
  if(!name) return;
  if(D.cats.list.indexOf(name) >= 0){ alert('이미 있는 이름이에요'); return; }
  if(commit({ t:'catAdd', name:name })) renderCatSettingsLists();
}

function removeCategory(name){
  if(!confirm('"' + name + '" 카테고리를 삭제할까요? (기존 지출 기록은 유지돼요)')) return;
  if(commit({ t:'catDel', name:name })) renderCatSettingsLists();
}

// ── 초기화 ──────────────────────────────────────────────────────────────
renderAll();
if(gasUrl()){
  setSyncIndicator('<span class="dot"></span>동기화 확인 중...');
  pull().then(function(){ setSyncIndicator('최신 상태예요', true); })
    .catch(function(e){ setSyncIndicator(syncErrorText(e), true); });
}

// 앱을 열어둔 채 한참 뒤 다시 화면으로 돌아오면 상대의 새 내역을 받아옴 (오래된 화면에서 저장하는 일 방지)
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState !== 'visible' || !gasUrl()) return;
  if(pending.length){ flush(); return; }
  if(Date.now() - lastPullAt > 15000) pull().catch(function(){});
});

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
